name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Flutter project
        working-directory: hotel_management_app
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
          flutter build web --release

      - name: Upload web release artifact
        uses: actions/upload-artifact@v4
        with:
          name: miftah-web-${{ github.sha }}
          path: hotel_management_app/build/web
          if-no-files-found: error
          retention-days: 14

  android:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Android APK and AAB
        working-directory: hotel_management_app
        run: |
          flutter pub get
          flutter build apk --release
          flutter build appbundle --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: miftah-android-apk-${{ github.sha }}
          path: hotel_management_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: miftah-android-aab-${{ github.sha }}
          path: hotel_management_app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

  ios-verify:
    runs-on: macos-latest
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate iOS release build without signing
        working-directory: hotel_management_app
        run: |
          flutter pub get
          flutter build ios --release --no-codesign
