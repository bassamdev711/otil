name: hotel_management_app
description: "تطبيق إدارة الفنادق المحلي — يعمل دون اتصال"
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  crypto: ^3.0.3
  flutter_secure_storage: ^9.2.2
  file_saver: ^0.4.0
  file_picker: ^11.0.2
  pdf: ^3.13.0
  printing: ^5.15.0
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4
  intl: ^0.19.0
  uuid: ^4.4.2
  # Firebase dependencies are intentionally reserved for a future feature flag.
  # firebase_core: ^3.4.0
  # cloud_firestore: ^5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # hive_generator and build_runner can be enabled when generated adapters are introduced.
  # hive_generator: ^2.0.1
  # build_runner: ^2.4.12

flutter:
  uses-material-design: true
  assets:
    - assets/brand/app_icon.png
    - assets/fonts/DejaVuSans.ttf
